<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StockAI · 美股AI助手</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121e;--pri:#10b981;--red:#ef4444;--acc:#6366f1;--txt:#f1f5f9;--dim:#64748b;--r:14px;--up:#10b981;--dn:#ef4444}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.app{max-width:440px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 70px)}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;position:sticky;top:0;background:var(--bg);z-index:10}
.hdr h1{font-size:20px;font-weight:800}
.hdr-tag{font-size:11px;color:var(--dim);background:#1a1a2e;padding:3px 10px;border-radius:12px}
.market-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.market-dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.market-dot.open{background:var(--up);box-shadow:0 0 6px rgba(16,185,129,.5)}

/* Signal Banner — the differentiator */
.signal-banner{border-radius:var(--r);padding:16px;margin:8px 0 14px;position:relative;overflow:hidden}
.signal-banner.bull{background:linear-gradient(135deg,#064e3b,#065f46);border:1px solid rgba(16,185,129,.2)}
.signal-banner.bear{background:linear-gradient(135deg,#450a0a,#7f1d1d);border:1px solid rgba(239,68,68,.2)}
.signal-banner.neutral{background:linear-gradient(135deg,#1e1b4b,#312e81);border:1px solid rgba(99,102,241,.2)}
.signal-icon{font-size:28px;margin-bottom:6px}
.signal-title{font-size:16px;font-weight:800;margin-bottom:4px}
.signal-text{font-size:13px;color:rgba(255,255,255,.8);line-height:1.5}
.signal-action{margin-top:10px;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;display:inline-block}
.bull .signal-action{background:rgba(16,185,129,.2);color:var(--up)}
.bear .signal-action{background:rgba(239,68,68,.2);color:var(--red)}
.neutral .signal-action{background:rgba(99,102,241,.2);color:var(--acc)}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;background:#1a1a2e;color:var(--dim);white-space:nowrap;cursor:pointer;border:none;transition:all .2s;flex-shrink:0}
.tab.on{background:var(--acc);color:white}

/* Watchlist */
.section-title{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin:14px 0 8px;font-weight:700}
.stock-row{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--card);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:transform .1s}
.stock-row:active{transform:scale(.98)}
.stock-left{display:flex;flex-direction:column;gap:2px}
.stock-ticker{font-size:15px;font-weight:800;letter-spacing:.5px}
.stock-name{font-size:11px;color:var(--dim)}
.stock-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stock-price{font-size:15px;font-weight:700}
.stock-change{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.stock-change.up{background:rgba(16,185,129,.15);color:var(--up)}
.stock-change.dn{background:rgba(239,68,68,.15);color:var(--dn)}

/* Mini chart */
.mini-chart{width:60px;height:24px;margin-left:10px}
.mini-chart svg{width:100%;height:100%}

/* Fear & Greed */
.fg-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.fg-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fg-label{font-size:14px;font-weight:700}
.fg-value{font-size:28px;font-weight:900}
.fg-bar{height:6px;background:#1e1e2e;border-radius:3px;overflow:hidden}
.fg-fill{height:100%;border-radius:3px;transition:width .5s}

/* News/Insights */
.insight{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:8px;border-left:3px solid var(--acc)}
.insight-time{font-size:10px;color:var(--dim);margin-bottom:4px}
.insight-title{font-size:14px;font-weight:700;margin-bottom:4px;line-height:1.3}
.insight-body{font-size:12px;color:var(--dim);line-height:1.5}
.insight-impact{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-top:6px}
.insight-impact.bullish{background:rgba(16,185,129,.15);color:var(--up)}
.insight-impact.bearish{background:rgba(239,68,68,.15);color:var(--dn)}

/* DCA Tracker */
.dca-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.dca-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dca-title{font-size:14px;font-weight:700}
.dca-badge{font-size:11px;background:rgba(16,185,129,.15);color:var(--up);padding:3px 10px;border-radius:12px}
.dca-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dca-stat{background:#1a1a2e;border-radius:8px;padding:10px}
.dca-stat-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.dca-stat-value{font-size:16px;font-weight:800;margin-top:2px}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom,8px) + 4px);background:var(--card);border-top:1px solid #1e1e2e;z-index:20}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--dim);cursor:pointer;padding:4px 12px;border:none;background:none}
.nav-item.on{color:var(--pri)}
.nav-icon{font-size:20px}

/* Loading shimmer */
.shimmer{background:linear-gradient(90deg,#1a1a2e 25%,#252540 50%,#1a1a2e 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:16px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Last updated */
.updated{text-align:center;font-size:10px;color:var(--dim);margin:12px 0}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="hdr">
    <h1>📈 StockAI</h1>
    <div class="market-status">
      <div class="market-dot" id="marketDot"></div>
      <span id="marketLabel">Market Closed</span>
    </div>
  </div>

  <!-- AI Signal Banner — unique value -->
  <div class="signal-banner neutral" id="signalBanner">
    <div class="signal-icon">🔍</div>
    <div class="signal-title">Loading AI Signal...</div>
    <div class="signal-text">Analyzing market conditions...</div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="watchlist">自选股</button>
    <button class="tab" data-tab="indices">指数</button>
    <button class="tab" data-tab="ai-chain">AI链</button>
    <button class="tab" data-tab="insights">信号</button>
    <button class="tab" data-tab="dca">定投</button>
  </div>

  <!-- Content -->
  <div id="content"></div>
  <div class="updated" id="updated"></div>
</div>

<!-- Bottom nav -->
<div class="nav">
  <button class="nav-item on" data-page="home"><span class="nav-icon">📊</span>行情</button>
  <button class="nav-item" data-page="signals"><span class="nav-icon">🎯</span>信号</button>
  <button class="nav-item" data-page="learn"><span class="nav-icon">📚</span>学习</button>
  <button class="nav-item" data-page="me"><span class="nav-icon">👤</span>我的</button>
</div>

<script>
// ===== DATA =====
const WATCHLIST = {
  indices: [
    { t: '^GSPC', n: 'S&P 500', cat: 'index' },
    { t: '^IXIC', n: 'NASDAQ', cat: 'index' },
    { t: '^DJI',  n: 'Dow Jones', cat: 'index' },
    { t: '^VIX',  n: 'VIX Fear', cat: 'index' }
  ],
  aiChain: [
    // Layer 1: Chips
    { t: 'NVDA', n: 'NVIDIA', cat: '🔧 芯片', layer: 'chip' },
    { t: 'AMD',  n: 'AMD', cat: '🔧 芯片', layer: 'chip' },
    { t: 'TSM',  n: 'TSMC', cat: '🔧 芯片', layer: 'chip' },
    { t: 'AVGO', n: 'Broadcom', cat: '🔧 芯片', layer: 'chip' },
    // Layer 2: Cloud/Infra
    { t: 'MSFT', n: 'Microsoft', cat: '☁️ 云/基建', layer: 'infra' },
    { t: 'AMZN', n: 'Amazon', cat: '☁️ 云/基建', layer: 'infra' },
    { t: 'GOOG', n: 'Google', cat: '☁️ 云/基建', layer: 'infra' },
    // Layer 3: Models
    { t: 'META', n: 'Meta (Llama)', cat: '🧠 模型', layer: 'model' },
    { t: 'PLTR', n: 'Palantir', cat: '🧠 模型', layer: 'model' },
    { t: 'AI',   n: 'C3.ai', cat: '🧠 模型', layer: 'model' },
    // Layer 4: Applications
    { t: 'CRM',  n: 'Salesforce', cat: '📱 应用', layer: 'app' },
    { t: 'NOW',  n: 'ServiceNow', cat: '📱 应用', layer: 'app' },
    { t: 'SNOW', n: 'Snowflake', cat: '📱 应用', layer: 'app' },
    // ETFs
    { t: 'QQQ',  n: 'NASDAQ ETF', cat: '📦 ETF', layer: 'etf' },
    { t: 'SPY',  n: 'S&P 500 ETF', cat: '📦 ETF', layer: 'etf' },
    { t: 'BOTZ', n: 'AI & Robotics ETF', cat: '📦 ETF', layer: 'etf' },
    { t: 'SMH',  n: 'Semiconductor ETF', cat: '📦 ETF', layer: 'etf' }
  ]
};

// Combine default watchlist
const ALL_STOCKS = [...WATCHLIST.indices, ...WATCHLIST.aiChain];
let prices = {};
let currentTab = 'watchlist';
let refreshTimer = null;

// ===== MARKET STATUS =====
function isMarketOpen() {
  const now = new Date();
  const et = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const day = et.getDay();
  const h = et.getHours(), m = et.getMinutes();
  const mins = h * 60 + m;
  return day >= 1 && day <= 5 && mins >= 570 && mins < 960; // 9:30-16:00 ET
}

function updateMarketStatus() {
  const open = isMarketOpen();
  document.getElementById('marketDot').classList.toggle('open', open);
  document.getElementById('marketLabel').textContent = open ? 'Market Open' : 'Market Closed';
}

// ===== FETCH PRICES (Yahoo Finance v8 chart API — no key needed) =====
async function fetchPrices() {
  const batch = ALL_STOCKS.map(s => s.t);
  const results = await Promise.allSettled(
    batch.map(async ticker => {
      const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=5d&interval=1d`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const meta = d.chart.result[0].meta;
      const prev = meta.chartPreviousClose || meta.previousClose;
      const price = meta.regularMarketPrice;
      const change = price - prev;
      // Get 5-day close prices for sparkline
      const closes = d.chart.result[0].indicators?.quote?.[0]?.close?.filter(v => v != null) || [];
      prices[ticker] = { price, change, changePct: prev ? (change / prev) * 100 : 0, prevClose: prev, spark: closes };
    })
  );
  const ok = results.filter(r => r.status === 'fulfilled').length;
  document.getElementById('updated').textContent = `${ok}/${batch.length} loaded · ${new Date().toLocaleTimeString()}`;
  render();
}

// ===== RENDER =====
function render() {
  const c = document.getElementById('content');
  updateMarketStatus();
  
  switch (currentTab) {
    case 'watchlist': renderWatchlist(c); break;
    case 'indices': renderIndices(c); break;
    case 'ai-chain': renderAIChain(c); break;
    case 'insights': renderInsights(c); break;
    case 'dca': renderDCA(c); break;
  }
}

function sparkSvg(data, up) {
  if (!data || data.length < 2) return '';
  const w=60, h=24, pad=2;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => `${pad + (i / (data.length - 1)) * (w - pad * 2)},${pad + (1 - (v - min) / range) * (h - pad * 2)}`).join(' ');
  const color = up ? '#10b981' : '#ef4444';
  return `<div class="mini-chart"><svg viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/></svg></div>`;
}

function stockRow(s) {
  const p = prices[s.t] || {};
  const price = p.price != null ? p.price.toFixed(2) : '---';
  const pct = p.changePct != null ? p.changePct.toFixed(2) : '0.00';
  const up = (p.changePct || 0) >= 0;
  const spark = sparkSvg(p.spark, up);
  return `<div class="stock-row" onclick="showDetail('${s.t}')">
    <div class="stock-left">
      <div class="stock-ticker">${s.t}</div>
      <div class="stock-name">${s.cat ? s.cat + ' · ' : ''}${s.n}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      ${spark}
      <div class="stock-right">
        <div class="stock-price">$${price}</div>
        <div class="stock-change ${up ? 'up' : 'dn'}">${up ? '+' : ''}${pct}%</div>
      </div>
    </div>
  </div>`;
}

function renderWatchlist(c) {
  const favorites = WATCHLIST.aiChain.filter(s => ['QQQ','SPY','NVDA','GOOG','META'].includes(s.t));
  c.innerHTML = `
    <div class="section-title">⭐ My Picks</div>
    ${favorites.map(stockRow).join('')}
    <div class="section-title">📦 AI ETFs</div>
    ${WATCHLIST.aiChain.filter(s => s.layer === 'etf').map(stockRow).join('')}
  `;
}

function renderIndices(c) {
  c.innerHTML = `
    <div class="section-title">🌍 Major Indices</div>
    ${WATCHLIST.indices.map(stockRow).join('')}
    ${renderFearGreed()}
  `;
}

function renderAIChain(c) {
  const layers = ['chip', 'infra', 'model', 'app', 'etf'];
  const layerNames = { chip: '🔧 Layer 1: 芯片', infra: '☁️ Layer 2: 云/基建', model: '🧠 Layer 3: 模型', app: '📱 Layer 4: 应用', etf: '📦 ETF 指数' };
  c.innerHTML = layers.map(l => `
    <div class="section-title">${layerNames[l]}</div>
    ${WATCHLIST.aiChain.filter(s => s.layer === l).map(stockRow).join('')}
  `).join('');
}

function renderFearGreed() {
  // VIX-based fear gauge
  const vix = prices['^VIX'];
  let score = 50, label = 'Neutral', color = 'var(--acc)';
  if (vix && vix.price) {
    if (vix.price < 15) { score = 80; label = '😎 Extreme Greed'; color = 'var(--up)'; }
    else if (vix.price < 20) { score = 65; label = '😊 Greed'; color = 'var(--up)'; }
    else if (vix.price < 25) { score = 50; label = '😐 Neutral'; color = 'var(--acc)'; }
    else if (vix.price < 30) { score = 35; label = '😰 Fear'; color = 'var(--dn)'; }
    else { score = 15; label = '😱 Extreme Fear'; color = 'var(--dn)'; }
  }
  return `<div class="fg-card">
    <div class="fg-row">
      <div class="fg-label">Fear & Greed (VIX)</div>
      <div class="fg-value" style="color:${color}">${score}</div>
    </div>
    <div style="font-size:13px;color:var(--dim);margin-bottom:8px">${label} · VIX: ${vix?.price?.toFixed(1) || '---'}</div>
    <div class="fg-bar"><div class="fg-fill" style="width:${score}%;background:${color}"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px">
      <span>极度恐惧</span><span>极度贪婪</span>
    </div>
  </div>`;
}

function renderInsights(c) {
  // These will be populated by the Claw backend pushing data
  const insights = JSON.parse(localStorage.getItem('stock-ai-insights') || '[]');
  if (insights.length === 0) {
    c.innerHTML = `
      <div class="insight">
        <div class="insight-time">System</div>
        <div class="insight-title">🔮 AI信号功能已就绪</div>
        <div class="insight-body">StockAI 会在以下情况推送信号：<br>
        • 你关注的AI股票出现异常波动（±3%+）<br>
        • 重大AI行业新闻（融资/发布/政策）<br>
        • 技术指标触发买入/卖出信号<br>
        • 定投日提醒（每月固定日期）<br>
        • 恐惧贪婪指数极端值（<20 或 >80）</div>
      </div>`;
    return;
  }
  c.innerHTML = insights.map(i => `
    <div class="insight" style="border-left-color:${i.bullish ? 'var(--up)' : 'var(--dn)'}">
      <div class="insight-time">${i.time}</div>
      <div class="insight-title">${i.title}</div>
      <div class="insight-body">${i.body}</div>
      <span class="insight-impact ${i.bullish ? 'bullish' : 'bearish'}">${i.bullish ? '📈 利好' : '📉 利空'}</span>
    </div>`).join('');
}

function renderDCA(c) {
  const dca = JSON.parse(localStorage.getItem('stock-ai-dca') || 'null') || {
    monthly: 1000,
    split: { QQQ: 40, SPY: 30, SMH: 20, BOTZ: 10 },
    startDate: new Date().toISOString().slice(0, 10),
    history: []
  };
  c.innerHTML = `
    <div class="dca-card">
      <div class="dca-header">
        <div class="dca-title">📅 定投计划</div>
        <div class="dca-badge">Active</div>
      </div>
      <div class="dca-grid">
        <div class="dca-stat">
          <div class="dca-stat-label">月投入</div>
          <div class="dca-stat-value">$${dca.monthly}</div>
        </div>
        <div class="dca-stat">
          <div class="dca-stat-label">已投入</div>
          <div class="dca-stat-value">$${dca.history.length * dca.monthly}</div>
        </div>
      </div>
    </div>
    <div class="section-title">分配比例</div>
    ${Object.entries(dca.split).map(([t, pct]) => {
      const s = WATCHLIST.aiChain.find(x => x.t === t) || { n: t };
      return `<div class="stock-row">
        <div class="stock-left">
          <div class="stock-ticker">${t}</div>
          <div class="stock-name">${s.n}</div>
        </div>
        <div class="stock-right">
          <div class="stock-price">${pct}%</div>
          <div class="stock-change up">$${(dca.monthly * pct / 100).toFixed(0)}/mo</div>
        </div>
      </div>`;
    }).join('')}
    <div class="section-title" style="margin-top:16px">💡 定投策略</div>
    <div class="insight">
      <div class="insight-title">为什么这样分配？</div>
      <div class="insight-body">
        <b>QQQ 40%</b> — 纳斯达克100，科技股大盘，稳<br>
        <b>SPY 30%</b> — 标普500，美国经济基本盘<br>
        <b>SMH 20%</b> — 半导体ETF，AI算力层直接受益<br>
        <b>BOTZ 10%</b> — AI&机器人ETF，高增长高波动
      </div>
    </div>
  `;
}

// ===== AI SIGNAL =====
function updateSignal() {
  const banner = document.getElementById('signalBanner');
  const aiStocks = WATCHLIST.aiChain.filter(s => s.layer !== 'etf');
  let upCount = 0, dnCount = 0, bigMoves = [];
  
  for (const s of aiStocks) {
    const p = prices[s.t];
    if (!p) continue;
    if (p.changePct > 0) upCount++;
    else dnCount++;
    if (Math.abs(p.changePct) > 3) bigMoves.push({ ...s, pct: p.changePct });
  }
  
  const total = upCount + dnCount;
  const bullPct = total > 0 ? upCount / total : 0.5;
  
  let mood, icon, title, text, action;
  if (bigMoves.length > 0) {
    const top = bigMoves.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct))[0];
    mood = top.pct > 0 ? 'bull' : 'bear';
    icon = top.pct > 0 ? '🚀' : '⚠️';
    title = `${top.t} ${top.pct > 0 ? '+' : ''}${top.pct.toFixed(1)}% 异常波动`;
    text = `${top.n} 今天大幅${top.pct > 0 ? '上涨' : '下跌'}，关注是否有重大消息。`;
    action = top.pct > 0 ? '关注买入机会' : '观望，勿追跌';
  } else if (bullPct > 0.7) {
    mood = 'bull'; icon = '📈'; title = 'AI板块整体偏多';
    text = `${upCount}/${total} AI相关股票上涨，市场情绪积极。`;
    action = '定投继续，不追高';
  } else if (bullPct < 0.3) {
    mood = 'bear'; icon = '📉'; title = 'AI板块整体偏空';
    text = `${dnCount}/${total} AI相关股票下跌，注意风险。`;
    action = '持有观望，等信号';
  } else {
    mood = 'neutral'; icon = '⚖️'; title = 'AI板块震荡中';
    text = `涨跌各半，无明显方向。适合定投，不适合单笔大买。`;
    action = '按计划定投即可';
  }
  
  banner.className = `signal-banner ${mood}`;
  banner.innerHTML = `
    <div class="signal-icon">${icon}</div>
    <div class="signal-title">${title}</div>
    <div class="signal-text">${text}</div>
    <div class="signal-action">${action}</div>`;
}

function showDetail(ticker) {
  // Future: open detail page with chart
  alert(`${ticker} detail coming soon`);
}

// ===== TAB HANDLING =====
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  tab.classList.add('on');
  currentTab = tab.dataset.tab;
  render();
});

// ===== INIT =====
async function init() {
  render(); // Show skeleton
  await fetchPrices();
  updateSignal();
  // Auto-refresh every 60s during market hours, 5min otherwise
  const interval = isMarketOpen() ? 60000 : 300000;
  refreshTimer = setInterval(async () => {
    await fetchPrices();
    updateSignal();
  }, interval);
}

init();
</script>
